const STKP=new Set();
async function STK(o,s){
 const on=['confirmed','shipped','delivered'].includes(s),off=['cancelled','returned'].includes(s);
 if(!((on&&!o.stockDone)||(off&&o.stockDone))||STKP.has(o._id))return;STKP.add(o._id);
 try{const dir=on?-1:1,need={};(o.items||[]).forEach(i=>{if(i.id)need[i.id]=(need[i.id]||0)+(+i.qty||0)});
  const b=writeBatch(db);let n=0;
  Object.entries(need).forEach(([pid,q])=>{const p=prods.find(x=>x.id===pid);if(!p||p.stock==null||p.stock==='')return;b.update(doc(db,'products',pid),{stock:Math.max(0,(+p.stock||0)+dir*q)});n++});
  b.update(doc(db,'orders',o._id),{stockDone:on});await b.commit();if(n)toast(on?'স্টক আপডেট হয়েছে (কমানো হলো)':'স্টক ফেরত যোগ হয়েছে')}
 catch(e){console.warn('stock:',e)}finally{STKP.delete(o._id)}}

 {let tok;try{tok=await au.currentUser.getIdToken()}catch(e){throw new Error('লগইন সেশন নেই, আবার লগইন করুন')}

  let j;try{j=await r.json()}catch(e){throw new Error(r.status===404||r.status===405?'এই ঠিকানায় সার্ভার API (/api/sf) নেই — অ্যাডমিন GitHub Pages-এ থাকলে সেটিংসে "সার্ভার URL" ঘরে Railway সার্ভারের লিংক দিন':'সার্ভার থেকে ভুল রেসপন্স (HTTP '+r.status+')')}
  if(j&&j.error&&!j.consignment)throw new Error(j.error);return j}
 let r;try{r=await fetch('https://portal.packzy.com/api/v1/'+path,{method,headers:SFH(),...(body?{body:JSON.stringify(body)}:{})})}catch(e){const x=new Error('ব্রাউজার থেকে Steadfast API ব্লক হয়েছে (CORS)। সেটিংসে "সার্ভার প্রক্সি" চালু করুন।');x.cors=1;throw x}
 let j;try{j=await r.json()}catch(e){throw new Error('Steadfast থেকে ভুল রেসপন্স (HTTP '+r.status+')')}
 return j}

<script id="bf-lock">
/* page behind an open sheet / invoice is frozen; Esc closes the top-most invoice */
(function(){
  var IDS=['odm','invWrap','rlm'], on=false, y=0;
  function any(){ for(var i=0;i<IDS.length;i++){ if(document.getElementById(IDS[i])) return true; } return false; }
  function lock(){ if(on) return; on=true; y=window.pageYOffset||document.documentElement.scrollTop||0; var s=document.body.style; s.position='fixed'; s.top=(-y)+'px'; s.left='0'; s.right='0'; s.width='100%'; document.documentElement.classList.add('bf-lock'); }
  function unlock(){ if(!on) return; on=false; var s=document.body.style; s.position=''; s.top=''; s.left=''; s.right=''; s.width=''; document.documentElement.classList.remove('bf-lock'); try{ window.scrollTo({top:y,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,y); } }
  function sync(){ if(any()) lock(); else unlock(); }
  new MutationObserver(sync).observe(document.body,{childList:true});
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; var w=document.getElementById('invWrap'); if(w){ w.remove(); e.stopImmediatePropagation(); } });
})();
</script>
<script id="ad-autogrow">
/* field-sizing না থাকা ব্রাউজারের জন্য: বিবরণ বক্স লেখার সাথে লম্বা হয় */
(function(){var native=!!(window.CSS&&CSS.supports&&CSS.supports('field-sizing','content'));
function ag(el){if(!el||native)return;el.style.height='auto';el.style.height=Math.max(el.scrollHeight+2,150)+'px'}
document.addEventListener('input',function(e){if(e.target&&e.target.id==='pd')ag(e.target)},true);
new MutationObserver(function(){var t=document.getElementById('pd');if(t&&!t.getAttribute('data-ag')){t.setAttribute('data-ag','1');ag(t)}}).observe(document.body,{childList:true,subtree:true});
})();
</script>
